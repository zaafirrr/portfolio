<!-- Apply the saved theme and language before the page draws, so it doesn't flash -->
<script>
  (function(){ try{
    var theme=localStorage.getItem('theme'); if(theme) document.documentElement.setAttribute('data-theme',theme);
    if(localStorage.getItem('lang')==='fr') document.documentElement.lang='fr';
  }catch(e){} })();
</script>
